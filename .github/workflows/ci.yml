name: CI

on:
  push:
    branches: [main, master, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,cache,fabric]"

      - name: Verify protobuf stubs
        run: python -c "from prism.wrapper.proto import chorus_pb2, chorus_pb2_grpc; print('proto ok')"

      - name: Run tests
        run: pytest --tb=short -q --cov=prism --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark deps
        run: |
          pip install -e ".[dev,cache]"
          pip install -r benchmark/requirements.txt

      - name: Start benchmark app
        run: |
          set -euo pipefail
          PRISM_BENCHMARK_SMOKE=1 uvicorn benchmark.app.main:app \
            --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/bench_app.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "App healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to become healthy"
          kill "$(cat /tmp/bench_app.pid)" || true
          exit 1

      - name: Run smoke benchmark (no Azure, in-memory only)
        run: >
          python benchmark/load/run_benchmark.py
          --scenario smoke
          --duration 15
          --host http://127.0.0.1:8000
          --no-azure
        env:
          PRISM_BENCHMARK_SMOKE: "1"
