version: "3.9"

# Single-node enterprise stack for local / staging validation.
#
# Usage:
#   export PRISM_API_KEYS="$(python -c 'from prism.api import generate_api_key; print(generate_api_key())')"
#   docker compose -f deploy/docker-compose.enterprise.yml up --build
#   PRISM_API_KEY=$PRISM_API_KEYS python examples/enterprise_client.py --query "shipping"

services:
  prismlib-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.enterprise
    container_name: prismlib-enterprise
    ports:
      - "9100:9100"
    environment:
      PRISM_TENANT_ID: enterprise-demo
      PRISM_API_REQUIRE_AUTH: "true"
      PRISM_API_KEYS: ${PRISM_API_KEYS:-}
      PRISM_API_RATE_LIMIT_RPM: "120"
      PRISM_HTTP_HOST: 0.0.0.0
      PRISM_HTTP_PORT: "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
