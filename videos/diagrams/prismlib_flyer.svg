<svg viewBox="0 0 760 1000" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>PrismLib product flyer</title>
  <desc>One-page flyer: PrismLib cuts LLM cost across three layers with real Azure benchmark numbers.</desc>

  <rect x="0" y="0" width="760" height="1000" fill="#0c0f1d"/>
  <rect x="0" y="0" width="760" height="6" fill="#6366f1"/>

  <text x="48" y="78" font-size="40" font-weight="800" fill="#ffffff">PrismLib</text>
  <text x="48" y="110" font-size="16" fill="#a5b4fc">Tensor-native LLM &amp; DB infrastructure · Open source · Apache 2.0</text>
  <text x="48" y="150" font-size="22" font-weight="700" fill="#f1f5f9">Stop paying for the same AI answer twice.</text>

  <g font-size="12" font-weight="700">
    <rect x="48" y="170" width="150" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="#6366f1"/>
    <text x="123" y="189" text-anchor="middle" fill="#a5b4fc">PyPI v0.4.0</text>
    <rect x="210" y="170" width="180" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="#38bdf8"/>
    <text x="300" y="189" text-anchor="middle" fill="#38bdf8">pip install prismlib</text>
    <rect x="402" y="170" width="200" height="28" rx="14" fill="rgba(52,211,153,0.12)" stroke="#34d399"/>
    <text x="502" y="189" text-anchor="middle" fill="#34d399">Free forever · Python 3.11+</text>
  </g>

  <g>
    <rect x="48" y="224" width="664" height="120" rx="14" fill="#141928" stroke="rgba(56,189,248,0.35)"/>
    <text x="70" y="258" font-size="19" font-weight="800" fill="#38bdf8">1 · PrismCache</text>
    <text x="70" y="284" font-size="14" fill="#94a3b8">Semantic LLM cache — catches paraphrased questions before they hit the model.</text>
    <text x="70" y="312" font-size="14" fill="#cbd5e1">No Redis · math-isolated per tenant · 5-line integration</text>
    <text x="692" y="272" text-anchor="end" font-size="30" font-weight="800" fill="#34d399">95.9%</text>
    <text x="692" y="296" text-anchor="end" font-size="12" fill="#64748b">hit rate (Azure load test)</text>

    <rect x="48" y="356" width="664" height="120" rx="14" fill="#141928" stroke="rgba(52,211,153,0.3)"/>
    <text x="70" y="390" font-size="19" font-weight="800" fill="#34d399">2 · PrismDriver</text>
    <text x="70" y="416" font-size="14" fill="#94a3b8">WAL-streamed DB driver — reads from an in-process index, not the network.</text>
    <text x="70" y="444" font-size="14" fill="#cbd5e1">Auto-invalidation from WAL/binlog · no SQL on the hot path</text>
    <text x="692" y="404" text-anchor="end" font-size="30" font-weight="800" fill="#34d399">70.7×</text>
    <text x="692" y="428" text-anchor="end" font-size="12" fill="#64748b">faster reads · 142ms → 2ms</text>

    <rect x="48" y="488" width="664" height="140" rx="14" fill="#141928" stroke="rgba(99,102,241,0.4)"/>
    <text x="70" y="522" font-size="19" font-weight="800" fill="#818cf8">3 · PrismLib Micro — CHORUS mesh</text>
    <text x="70" y="548" font-size="14" fill="#94a3b8">Shares answers across every container, and survives node failure.</text>
    <text x="70" y="576" font-size="14" fill="#cbd5e1">Cluster cache · health alerts · Blue/Green/Orange failover — no Prometheus, no Kafka operator</text>
    <text x="692" y="536" text-anchor="end" font-size="30" font-weight="800" fill="#34d399">76%</text>
    <text x="692" y="560" text-anchor="end" font-size="12" fill="#64748b">avg token savings (3-node Azure)</text>
    <text x="70" y="606" font-size="12.5" fill="#a5b4fc">~22ms cross-VNet sync   ·   &lt;700ms alerts   ·   ~4s + 97ms failover, no human</text>
  </g>

  <rect x="48" y="648" width="664" height="92" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.25)"/>
  <text x="380" y="680" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Answer once. Every server gets it free. If one dies, a backup takes over.</text>
  <text x="380" y="708" text-anchor="middle" font-size="13" fill="#94a3b8">All numbers from real Azure Container Apps runs (westus2). Reproducible benchmark in the repo.</text>
  <text x="380" y="728" text-anchor="middle" font-size="13" fill="#94a3b8">58–64% fewer context tokens per call · zero external infrastructure</text>

  <text x="48" y="784" font-size="15" font-weight="700" fill="#a5b4fc">Free core · ChorusMesh commercial tiers</text>
  <g font-size="13" fill="#cbd5e1">
    <rect x="48" y="800" width="160" height="64" rx="10" fill="#141928" stroke="rgba(148,163,184,0.2)"/>
    <text x="128" y="828" text-anchor="middle" font-weight="700" fill="#34d399">Free</text>
    <text x="128" y="850" text-anchor="middle" font-size="11" fill="#64748b">Open source · all nodes</text>

    <rect x="220" y="800" width="160" height="64" rx="10" fill="#141928" stroke="rgba(148,163,184,0.2)"/>
    <text x="300" y="828" text-anchor="middle" font-weight="700" fill="#f1f5f9">$29–$149</text>
    <text x="300" y="850" text-anchor="middle" font-size="11" fill="#64748b">Dev / Team · Slack, PagerDuty</text>

    <rect x="392" y="800" width="160" height="64" rx="10" fill="#141928" stroke="rgba(148,163,184,0.2)"/>
    <text x="472" y="828" text-anchor="middle" font-weight="700" fill="#f1f5f9">$499</text>
    <text x="472" y="850" text-anchor="middle" font-size="11" fill="#64748b">Business · escalation, multi-region</text>

    <rect x="564" y="800" width="148" height="64" rx="10" fill="#141928" stroke="rgba(52,211,153,0.3)"/>
    <text x="638" y="828" text-anchor="middle" font-weight="700" fill="#34d399">Enterprise</text>
    <text x="638" y="850" text-anchor="middle" font-size="11" fill="#64748b">Air-gap · SOC 2 · SLA</text>
  </g>

  <rect x="0" y="912" width="760" height="88" fill="#10163a"/>
  <text x="48" y="950" font-size="18" font-weight="800" fill="#ffffff">pip install "prismlib[fabric]"</text>
  <text x="48" y="976" font-size="13" fill="#94a3b8">github.com/insightitsGit/prismlib   ·   pypi.org/project/prismlib   ·   Enterprise: insightits.info@gmail.com</text>
</svg>
